<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#060612"/>
    </radialGradient>

    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Inner ring gradient -->
    <linearGradient id="innerRingGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Orbit ellipse gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Second orbit gradient -->
    <linearGradient id="orbit2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- T letter gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Core glow gradient -->
    <radialGradient id="coreGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#a5f3fc" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0891b2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Electron dot gradient -->
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Purple dot gradient -->
    <radialGradient id="purpleDotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow filter -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft ambient glow -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip circle -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="230"/>
    </clipPath>
  </defs>

  <!-- ── BACKGROUND ── -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>

  <!-- Subtle inner background glow -->
  <circle cx="256" cy="220" r="160" fill="#1e1b4b" opacity="0.5" filter="url(#ambientGlow)"/>

  <!-- ── OUTER BORDER RING ── -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.7"/>
  <circle cx="256" cy="256" r="234" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.25"/>

  <!-- ── INNER DECORATIVE RING ── -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#innerRingGrad)" stroke-width="1" opacity="0.4"/>

  <!-- ── STAR FIELD (subtle background dots) ── -->
  <circle cx="100" cy="90" r="1.5" fill="#a5f3fc" opacity="0.6"/>
  <circle cx="160" cy="60" r="1" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="380" cy="80" r="1.5" fill="#a5f3fc" opacity="0.7"/>
  <circle cx="430" cy="130" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="450" cy="200" r="1.5" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="460" cy="350" r="1" fill="#a5f3fc" opacity="0.6"/>
  <circle cx="400" cy="430" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="300" cy="460" r="1" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="130" cy="440" r="1.5" fill="#a5f3fc" opacity="0.6"/>
  <circle cx="70" cy="370" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="60" cy="200" r="1.5" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="80" cy="310" r="1" fill="#a5f3fc" opacity="0.4"/>
  <circle cx="340" cy="50" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="200" cy="470" r="1.5" fill="#a5f3fc" opacity="0.4"/>
  <circle cx="480" cy="270" r="1" fill="#c4b5fd" opacity="0.5"/>

  <!-- ── ORBIT ELLIPSES ── -->
  <!-- Primary orbit - tilted -35 degrees, cyan -->
  <ellipse cx="256" cy="256" rx="195" ry="72"
    fill="none" stroke="url(#orbitGrad)" stroke-width="2"
    transform="rotate(-35, 256, 256)" opacity="0.85"/>

  <!-- Secondary orbit - tilted +35 degrees, purple -->
  <ellipse cx="256" cy="256" rx="195" ry="72"
    fill="none" stroke="url(#orbit2Grad)" stroke-width="1.5"
    transform="rotate(35, 256, 256)" opacity="0.7"/>

  <!-- Tertiary orbit - vertical, subtle -->
  <ellipse cx="256" cy="256" rx="195" ry="72"
    fill="none" stroke="#06b6d4" stroke-width="1"
    transform="rotate(90, 256, 256)" opacity="0.25"/>

  <!-- ── ORBIT ELECTRON DOTS ── -->
  <!-- Cyan orbit electrons -->
  <circle cx="451" cy="256" r="9" fill="url(#dotGrad)" filter="url(#glow)"
    transform="rotate(-35, 256, 256)"/>
  <circle cx="61" cy="256" r="7" fill="url(#dotGrad)" filter="url(#glow)"
    transform="rotate(-35, 256, 256)"/>
  <circle cx="360" cy="214" r="5.5" fill="url(#dotGrad)" filter="url(#glow)"
    transform="rotate(-35, 256, 256)"/>

  <!-- Purple orbit electrons -->
  <circle cx="451" cy="256" r="8" fill="url(#purpleDotGrad)" filter="url(#glow)"
    transform="rotate(35, 256, 256)"/>
  <circle cx="61" cy="256" r="6" fill="url(#purpleDotGrad)" filter="url(#glow)"
    transform="rotate(35, 256, 256)"/>
  <circle cx="152" cy="298" r="5" fill="url(#purpleDotGrad)" filter="url(#glow)"
    transform="rotate(35, 256, 256)"/>

  <!-- ── CENTRAL GLOW HALO ── -->
  <circle cx="256" cy="256" r="90" fill="#0891b2" opacity="0.08" filter="url(#ambientGlow)"/>
  <circle cx="256" cy="256" r="60" fill="#7c3aed" opacity="0.06" filter="url(#ambientGlow)"/>

  <!-- ── STYLIZED "T" LETTER ── -->
  <!-- T horizontal bar -->
  <rect x="178" y="196" width="156" height="28" rx="8"
    fill="url(#tGrad)" filter="url(#glow)"/>

  <!-- T vertical stem -->
  <rect x="234" y="196" width="44" height="120" rx="8"
    fill="url(#tGrad)" filter="url(#glow)"/>

  <!-- T inner highlight (top bar) -->
  <rect x="182" y="198" width="148" height="10" rx="5"
    fill="white" opacity="0.35"/>

  <!-- T inner highlight (stem) -->
  <rect x="238" y="210" width="16" height="100" rx="4"
    fill="white" opacity="0.2"/>

  <!-- ── CORE GLOW BEHIND T ── -->
  <circle cx="256" cy="256" r="75" fill="url(#coreGrad)" opacity="0.18" filter="url(#strongGlow)"/>

  <!-- ── ACCENT DOTS AT T CORNERS ── -->
  <circle cx="178" cy="210" r="5" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="334" cy="210" r="5" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="234" cy="316" r="5" fill="#8b5cf6" opacity="0.9" filter="url(#glow)"/>
  <circle cx="278" cy="316" r="5" fill="#8b5cf6" opacity="0.9" filter="url(#glow)"/>

  <!-- ── OUTER RING HIGHLIGHT ARC ── -->
  <path d="M 80 180 A 200 200 0 0 1 432 180"
    fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
</svg>
