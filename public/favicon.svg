<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#060612"/>
    </radialGradient>

    <!-- Orbit gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- T letter gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Electron dot -->
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>

  <!-- Outer border ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.8"/>

  <!-- Single prominent orbit ellipse -->
  <ellipse cx="256" cy="256" rx="190" ry="68"
    fill="none" stroke="url(#orbitGrad)" stroke-width="3"
    transform="rotate(-35, 256, 256)" opacity="0.9"/>

  <!-- Orbit electron dots -->
  <circle cx="446" cy="256" r="11" fill="url(#dotGrad)" filter="url(#glow)"
    transform="rotate(-35, 256, 256)"/>
  <circle cx="66" cy="256" r="9" fill="url(#dotGrad)" filter="url(#glow)"
    transform="rotate(-35, 256, 256)"/>

  <!-- T horizontal bar -->
  <rect x="180" y="198" width="152" height="30" rx="9"
    fill="url(#tGrad)" filter="url(#glow)"/>

  <!-- T vertical stem -->
  <rect x="236" y="198" width="40" height="118" rx="9"
    fill="url(#tGrad)" filter="url(#glow)"/>

  <!-- T highlight -->
  <rect x="184" y="200" width="144" height="11" rx="5"
    fill="white" opacity="0.4"/>
  <rect x="240" y="214" width="14" height="96" rx="4"
    fill="white" opacity="0.25"/>
</svg>
